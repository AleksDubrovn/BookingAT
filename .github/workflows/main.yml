name: Run autotests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: PROD
      TEST_BASE_URL: https://restful-booker.herokuapp.com
      PROD_BASE_URL: https://restful-booker.herokuapp.com

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v